<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกม AR คลังสัญลักษณ์ผังงาน (สเปกเบาพิเศษ)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { background-color: #060913; overflow: hidden; user-select: none; font-family: 'Sarabun', sans-serif; }
        .font-mono { font-family: 'Chakra Petch', monospace; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

    <script>
        const AudioSynth = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playPop() {
                try {
                    this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.1);
                } catch(e) {}
            },
            playFail() {
                try {
                    this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.25);
                } catch(e) {}
            }
        };
    </script>

    <div id="screen-intro" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 bg-slate-950/95 backdrop-blur-md">
        <div class="max-w-2xl w-full text-center space-y-6 p-8 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl overflow-y-auto max-h-[95vh]">
            <span class="text-5xl block animate-bounce">🎯</span>
            <h1 class="text-3xl font-black font-mono bg-clip-text text-transparent bg-gradient-to-r from-amber-400 to-emerald-400">
                AR เกมยิงสัญลักษณ์ผังงาน
            </h1>
            <p class="text-slate-400 text-xs">เวอร์ชันลดสเปกคอมพิวเตอร์ เน้นดูรูปทรงสัญลักษณ์ล้วนๆ ไม่มีตัวอักษรบอกใบ้บนเป้า!</p>
            
            <div class="border-t border-slate-800 pt-4 space-y-5 text-left max-w-md mx-auto">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">1. เลือกระดับความเร็ว (ความยาก)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setDifficulty('easy')" id="btn-diff-easy" class="py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-emerald-500 text-emerald-400">🐢 ช้ามาก</button>
                        <button onclick="setDifficulty('medium')" id="btn-diff-medium" class="py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-transparent">⚡ ปานกลาง</button>
                        <button onclick="setDifficulty('hard')" id="btn-diff-hard" class="py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-transparent">🔥 ยากมาก</button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">2. เลือกเวลาเล่นเกม</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setGameTime(30)" id="btn-time-30" class="py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-transparent">30 วิ</button>
                        <button onclick="setGameTime(60)" id="btn-time-60" class="py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-amber-500 text-amber-400">60 วิ</button>
                        <button onclick="setGameTime(90)" id="btn-time-90" class="py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-transparent">90 วิ</button>
                    </div>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-5 space-y-3">
                <label class="text-xs font-bold text-slate-300 block">3. เลือกโหมดควบคุมเพื่อเริ่มเล่น</label>
                <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
                    <button onclick="startGame('ar')" class="p-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-bold rounded-2xl shadow-xl transition-all text-sm flex flex-col items-center justify-center gap-1">
                        <span>🤖 เปิดกล้อง </span>
                        <span class="text-[10px] opacity-70 font-normal">(ใช้นิ้วชี้เล็งบนจอ)</span>
                    </button>
                    <button onclick="startGame('mouse')" class="p-4 bg-slate-800 hover:bg-slate-700 font-bold rounded-2xl transition-all text-sm flex flex-col items-center justify-center gap-1">
                        <span>🖱️ ใช้เมาส์เล่น</span>
                        <span class="text-[10px] opacity-70 font-normal">(ขยับ เมาส์เล็ง)</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-screen max-h-screen overflow-hidden">
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between z-10">
            <div class="flex-1">
                <span class="text-[10px] uppercase font-mono tracking-widest text-indigo-400 font-bold block">TARGET OBJECTIVE</span>
                <h1 class="text-lg md:text-2xl font-black text-slate-100">
                    จงยิง: <span id="target-instruction" class="text-amber-400">...</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="bg-slate-950 border border-slate-800 px-4 py-1.5 rounded-xl font-mono text-center min-w-[80px]">
                    <span class="text-[10px] text-slate-500 block uppercase">Time Left</span>
                    <span id="timer-text" class="font-black text-xl text-amber-500">60</span>
                </div>
                <div class="bg-slate-950 border border-slate-800 px-5 py-1.5 rounded-xl font-mono text-center min-w-[90px]">
                    <span class="text-[10px] text-slate-500 block uppercase">Score</span>
                    <span id="score-text" class="font-black text-xl text-emerald-400">0</span>
                </div>
                <button onclick="exitGame()" class="bg-red-600 hover:bg-red-500 text-white font-bold text-sm px-4 py-3 rounded-xl transition-all">✕ ออก</button>
            </div>
        </header>

        <div class="flex-1 relative bg-slate-950 flex items-center justify-center">
            <video id="webcam" class="hidden" autoplay playsinline muted></video>
            <canvas id="game-canvas" class="w-full h-full max-w-full max-h-full aspect-[4/3] bg-transparent z-10"></canvas>
            
            <div id="game-over-box" class="hidden absolute inset-0 bg-slate-950/90 z-20 flex flex-col items-center justify-center p-4">
                <div class="text-center space-y-5 bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-sm w-full shadow-2xl">
                    <h2 class="text-3xl font-black font-mono text-amber-400">⏱️ หมดเวลาแล้ว!</h2>
                    <p class="text-slate-400 text-sm">คะแนนรวมที่คุณครูหรือนักเรียนทำได้</p>
                    <div class="text-5xl font-black text-emerald-400 font-mono py-2 bg-slate-950/50 rounded-2xl border border-slate-800" id="final-score">0</div>
                    <button onclick="location.reload()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition-all">🔄 เล่นใหม่อีกครั้ง</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SYMBOL_TYPES = [
            { name: "เริ่มต้นและสิ้นสุด", shape: "terminator", color: "#fbbf24", bg: "rgba(251,191,36,0.2)" }, // เหลืองส้ม
            { name: "ลูกศรแสดงทิศทาง", shape: "flowline", color: "#ffffff", bg: "rgba(255,255,255,0.05)" }, // ขาว
            { name: "ปฏิบัติงาน", shape: "process", color: "#10b981", bg: "rgba(16,185,129,0.2)" }, // เขียว
            { name: "รับข้อมูล", shape: "input", color: "#f472b6", bg: "rgba(244,114,182,0.2)" }, // ชมพูม่วง
            { name: "แสดงผลทางจอภาพ", shape: "display", color: "#0ea5e9", bg: "rgba(14,165,233,0.2)" }, // ฟ้า
            { name: "การตัดสินใจ", shape: "decision", color: "#8b5cf6", bg: "rgba(139,92,246,0.2)" }, // ม่วง
            { name: "จุดเชื่อมต่อของผังงาน", shape: "connector", color: "#ef4444", bg: "rgba(239,68,68,0.25)" } // แดง
        ];

        let speedConfig = { min: -0.8, max: -1.6, spawnRate: 75 };
        let gameDuration = 60;
        let timeLeft = 60;
        let isPlaying = false;
        let timerInterval = null;

        let currentTarget = null;
        let score = 0;
        let controlMode = 'mouse';
        
        let canvas = document.getElementById("game-canvas");
        let ctx = canvas.getContext("2d");
        let canvasWidth = 800;
        let canvasHeight = 600;

        let cursor = { x: 400, y: 300 };
        let smoothedCursor = { x: 400, y: 300 };
        let floatingItems = [];
        let particles = [];
        let spawnTimer = 0;
        let animationFrameId = null;

        function setDifficulty(level) {
            ['easy', 'medium', 'hard'].forEach(l => {
                document.getElementById(`btn-diff-${l}`).className = "py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-transparent";
            });
            const btn = document.getElementById(`btn-diff-${level}`);
            if(level === 'easy') {
                speedConfig = { min: -0.8, max: -1.6, spawnRate: 75 };
                btn.className = "py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-emerald-500 text-emerald-400";
            } else if(level === 'medium') {
                speedConfig = { min: -2.0, max: -3.2, spawnRate: 55 };
                btn.className = "py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-blue-500 text-blue-400";
            } else if(level === 'hard') {
                speedConfig = { min: -3.5, max: -5.5, spawnRate: 40 };
                btn.className = "py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-red-500 text-red-400";
            }
            AudioSynth.playPop();
        }

        function setGameTime(seconds) {
            [30, 60, 90].forEach(s => {
                document.getElementById(`btn-time-${s}`).className = "py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-transparent";
            });
            gameDuration = seconds;
            timeLeft = seconds;
            document.getElementById(`btn-time-${seconds}`).className = "py-2 px-3 rounded-xl bg-slate-800 text-sm font-bold border border-amber-500 text-amber-400";
            document.getElementById("timer-text").innerText = timeLeft;
            AudioSynth.playPop();
        }

        function startGame(mode) {
            controlMode = mode;
            isPlaying = true;
            AudioSynth.playPop();
            document.getElementById("screen-intro").style.display = 'none';
            
            pickRandomTarget();
            
            document.getElementById("timer-text").innerText = timeLeft;
            timerInterval = setInterval(() => {
                if(!isPlaying) return;
                timeLeft--;
                document.getElementById("timer-text").innerText = timeLeft;
                if(timeLeft <= 0) endGame();
            }, 1000);

            if (mode === 'ar') initAR();
            if (!animationFrameId) renderLoop();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById("final-score").innerText = score;
            document.getElementById("game-over-box").classList.remove("hidden");
        }

        function exitGame() {
            if (confirm("ออกจากเกมและกลับไปหน้าเลือกโหมดใช่ไหมคะ?")) {
                location.reload();
            }
        }

        function pickRandomTarget() {
            currentTarget = SYMBOL_TYPES[Math.floor(Math.random() * SYMBOL_TYPES.length)];
            document.getElementById("target-instruction").innerText = currentTarget.name;
        }

        function spawnSymbol() {
            if(!isPlaying) return;
            const type = SYMBOL_TYPES[Math.floor(Math.random() * SYMBOL_TYPES.length)];
            const vy = speedConfig.min + Math.random() * (speedConfig.max - speedConfig.min);
            
            floatingItems.push({
                x: 120 + Math.random() * (canvasWidth - 240),
                y: canvasHeight + 60,
                vy: vy,
                type: type,
                radius: 50,
                lockProgress: 0
            });
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            const webcam = document.getElementById("webcam");
            if (controlMode === 'ar' && webcam.readyState >= 2) {
                ctx.save(); ctx.scale(-1, 1); ctx.translate(-canvasWidth, 0);
                ctx.globalAlpha = 0.5; ctx.drawImage(webcam, 0, 0, canvasWidth, canvasHeight);
                ctx.restore();
            } else {
                ctx.fillStyle = "#090d1a"; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                ctx.strokeStyle = "rgba(30, 41, 59, 0.2)"; ctx.lineWidth = 1;
                for (let x = 0; x < canvasWidth; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke(); }
                for (let y = 0; y < canvasHeight; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke(); }
            }

            if(isPlaying) {
                spawnTimer++;
                if (spawnTimer > speedConfig.spawnRate) { spawnSymbol(); spawnTimer = 0; }
            }

            // Cards Logic
            for (let i = floatingItems.length - 1; i >= 0; i--) {
                let item = floatingItems[i];
                if(isPlaying) item.y += item.vy;

                let dx = item.x - smoothedCursor.x;
                let dy = item.y - smoothedCursor.y;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (isPlaying && dist < item.radius) {
                    item.lockProgress += 0.07; // ล็อกเป้าเร็วขึ้นเล็กน้อยในโหมดลดสเปกเพื่อความฉับไว
                    if (item.lockProgress >= 1) {
                        floatingItems.splice(i, 1);
                        if (currentTarget && item.type.shape === currentTarget.shape) {
                            score += 10;
                            AudioSynth.playPop();
                            createExplosion(item.x, item.y, item.type.color);
                            pickRandomTarget();
                        } else {
                            AudioSynth.playFail();
                            createExplosion(item.x, item.y, "#ef4444");
                            score = Math.max(0, score - 5);
                        }
                        document.getElementById("score-text").innerText = score;
                        continue;
                    }
                } else {
                    item.lockProgress = Math.max(0, item.lockProgress - 0.035);
                }

                if (item.y < -80) { floatingItems.splice(i, 1); continue; }

                // DRAW EXACT SHAPES ONLY (NO TEXT INSIDE)
                ctx.save();
                ctx.strokeStyle = item.type.color;
                ctx.fillStyle = item.type.bg;
                ctx.lineWidth = 4;

                if (item.type.shape === "terminator") {
                    drawRoundedRect(ctx, item.x - 55, item.y - 22, 110, 44, 22);
                } 
                else if (item.type.shape === "flowline") {
                    ctx.fillStyle = "rgba(255,255,255,0.1)";
                    drawRoundedRect(ctx, item.x - 30, item.y - 30, 60, 60, 8);
                    ctx.fill();
                    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(item.x - 15, item.y); ctx.lineTo(item.x + 15, item.y); 
                    ctx.lineTo(item.x + 7, item.y - 5); ctx.moveTo(item.x + 15, item.y); ctx.lineTo(item.x + 7, item.y + 5);
                    ctx.stroke();
                } 
                else if (item.type.shape === "process") {
                    ctx.rect(item.x - 55, item.y - 25, 110, 50);
                } 
                else if (item.type.shape === "input") {
                    ctx.beginPath();
                    ctx.moveTo(item.x - 35, item.y - 22);
                    ctx.lineTo(item.x + 55, item.y - 22);
                    ctx.lineTo(item.x + 35, item.y + 22);
                    ctx.lineTo(item.x - 55, item.y + 22);
                    ctx.closePath();
                } 
                else if (item.type.shape === "display") {
                    ctx.beginPath();
                    ctx.moveTo(item.x - 55, item.y);
                    ctx.lineTo(item.x - 25, item.y - 25);
                    ctx.lineTo(item.x + 45, item.y - 25);
                    ctx.quadraticCurveTo(item.x + 55, item.y - 25, item.x + 55, item.y);
                    ctx.quadraticCurveTo(item.x + 55, item.y + 25, item.x + 45, item.y + 25);
                    ctx.lineTo(item.x - 25, item.y + 25);
                    ctx.closePath();
                } 
                else if (item.type.shape === "decision") {
                    ctx.beginPath();
                    ctx.moveTo(item.x, item.y - 35);
                    ctx.lineTo(item.x + 50, item.y);
                    ctx.lineTo(item.x, item.y + 35);
                    ctx.lineTo(item.x - 50, item.y);
                    ctx.closePath();
                } 
                else if (item.type.shape === "connector") {
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, 25, 0, Math.PI * 2);
                }
                
                if(item.type.shape !== "flowline") ctx.fill();
                ctx.stroke();

                // Lock-on ring indicator
                if (item.lockProgress > 0) {
                    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.radius + 4, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * item.lockProgress));
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                if (p.alpha <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            smoothedCursor.x += (cursor.x - smoothedCursor.x) * 0.35;
            smoothedCursor.y += (cursor.y - smoothedCursor.y) * 0.35;

            // Reticle Target
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(smoothedCursor.x, smoothedCursor.y, 10, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(smoothedCursor.x - 14, smoothedCursor.y); ctx.lineTo(smoothedCursor.x + 14, smoothedCursor.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(smoothedCursor.x, smoothedCursor.y - 14); ctx.lineTo(smoothedCursor.x, smoothedCursor.y + 14); ctx.stroke();

            animationFrameId = requestAnimationFrame(renderLoop);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                let angle = Math.random() * Math.PI * 2; let speed = 2 + Math.random() * 3;
                particles.push({ x: x, y: y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, r: 2+Math.random()*2, color: color, alpha: 1 });
            }
        }

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y); ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius); ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height); ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius); ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath();
        }

        canvas.addEventListener('mousemove', (e) => {
            if (controlMode !== 'mouse') return;
            const r = canvas.getBoundingClientRect();
            cursor.x = (e.clientX - r.left) / r.width * canvasWidth;
            cursor.y = (e.clientY - r.top) / r.height * canvasHeight;
        });

        function initAR() {
            if (!window.isSecureContext) {
                alert("โหมดกล้อง (AR) ต้องเปิดผ่านลิงก์ที่เป็น HTTPS เท่านั้น กรุณาเปิดผ่านลิงก์เว็บที่โฮสต์ไว้ (เช่น GitHub Pages) แทนการเปิดไฟล์ตรงๆ");
                location.reload();
                return;
            }
            const webcam = document.getElementById("webcam");
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            
            // CRITICAL LITE SETTINGS FOR PERFORMANCE (ตั้งค่าตรวจจับแบบลดสเปกพิเศษ)
            hands.setOptions({ 
                maxNumHands: 1, 
                modelComplexity: 0, // สเปกต่ำสุด ไม่กินพลังเครื่อง
                minDetectionConfidence: 0.55, 
                minTrackingConfidence: 0.55 
            });
            
            hands.onResults(results => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const indexFingerTip = results.multiHandLandmarks[0][8];
                    cursor.x = (1 - indexFingerTip.x) * canvasWidth;
                    cursor.y = indexFingerTip.y * canvasHeight;
                }
            });
            const camera = new Camera(webcam, { onFrame: async () => { await hands.send({ image: webcam }); }, width: 640, height: 480 });
            camera.start().catch(err => {
                alert("ไม่สามารถเข้าถึงกล้องเว็บแคมได้ กรุณาตรวจสอบสิทธิ์เปิดกล้อง");
            });
        }

        canvas.width = canvasWidth; canvas.height = canvasHeight;
    </script>
</body>
</html>
